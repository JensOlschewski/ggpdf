name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, no leading v, no suffix — must be dotted numeric for the Windows installer)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Same fetch as ci.yml's "Fetch PDFium (macOS)" step — see its own
      # comment for why this isn't vendored in the repo.
      - name: Fetch PDFium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          case "$(uname -m)" in
            arm64) asset=pdfium-mac-arm64 ;;
            x86_64) asset=pdfium-mac-x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest \
            | grep -oE "https://[^\"]+${asset}\.tgz")
          curl -fsSL "$url" -o pdfium.tgz
          mkdir -p pdfium
          tar -xzf pdfium.tgz -O lib/libpdfium.dylib > pdfium/libpdfium.dylib
          chmod +x pdfium/libpdfium.dylib

      - name: Build
        run: cargo build --release --locked

      - name: Bundle
        run: ./scripts/build-macos-app.sh "$(pwd)" "$RUNNER_TEMP/ggPdf.app" "${{ inputs.version }}"

      - name: Build DMG
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg-src"
          cp -R "$RUNNER_TEMP/ggPdf.app" "$RUNNER_TEMP/dmg-src/"
          ln -s /Applications "$RUNNER_TEMP/dmg-src/Applications"
          hdiutil create -volname "ggPdf" -srcfolder "$RUNNER_TEMP/dmg-src" \
            -ov -format UDZO "ggPdf-macos-${{ inputs.version }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ggpdf-macos
          path: ggPdf-macos-${{ inputs.version }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Same fetch as ci.yml's "Fetch PDFium (Windows)" step.
      - name: Fetch PDFium
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest \
            | grep -oE "https://[^\"]+pdfium-win-x64\.tgz")
          curl -fsSL "$url" -o pdfium.tgz
          mkdir -p pdfium
          tar -xzf pdfium.tgz -O bin/pdfium.dll > pdfium/pdfium.dll

      - name: Build
        run: cargo build --release --locked

      - name: Bundle
        shell: pwsh
        run: ./scripts/build-windows-app.ps1 -Root (Get-Location) -OutDir "$env:RUNNER_TEMP/ggPdf"

      # Assumed path for GitHub's windows-latest runner image's preinstalled
      # Inno Setup 6. Verify this still holds on a live run before relying
      # on it long-term — runner image contents change over time.
      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DBuildDir=$env:RUNNER_TEMP/ggPdf" `
            scripts/ggpdf.iss
        env:
          GGPDF_VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ggpdf-windows
          path: ggPdf-windows-${{ inputs.version }}-setup.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      # gh release create --generate-notes shells out to git to diff
      # against the previous tag — needs a real checkout, not just the
      # downloaded artifacts.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: gh release create "v${{ inputs.version }}" dist/*.dmg dist/*.exe --title "v${{ inputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

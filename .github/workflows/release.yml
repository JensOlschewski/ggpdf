name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.2.0, no leading v, no suffix — must be dotted numeric for the Windows installer)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch PDFium
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          case "$(uname -m)" in
            arm64) asset=pdfium-mac-arm64 ;;
            x86_64) asset=pdfium-mac-x64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest \
            | grep -oE "https://[^\"]+${asset}\.tgz")
          curl -fsSL "$url" -o pdfium.tgz
          mkdir -p pdfium
          tar -xzf pdfium.tgz -O lib/libpdfium.dylib > pdfium/libpdfium.dylib
          chmod +x pdfium/libpdfium.dylib

      - name: Build
        run: cargo build --release --locked

      - name: Verify architectures
        run: |
          lipo -verify_arch "${{ matrix.arch }}" target/release/ggpdf
          lipo -verify_arch "${{ matrix.arch }}" pdfium/libpdfium.dylib

      - name: Bundle
        run: ./scripts/build-macos-app.sh "$(pwd)" "$RUNNER_TEMP/ggPdf.app" "${{ inputs.version }}"

      - name: Build DMG
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/dmg-src"
          cp -R "$RUNNER_TEMP/ggPdf.app" "$RUNNER_TEMP/dmg-src/"
          ln -s /Applications "$RUNNER_TEMP/dmg-src/Applications"
          hdiutil create -volname "ggPdf" -srcfolder "$RUNNER_TEMP/dmg-src" \
            -ov -format UDZO "ggPdf-macos-${{ inputs.version }}-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ggpdf-macos-${{ matrix.arch }}
          path: ggPdf-macos-${{ inputs.version }}-${{ matrix.arch }}.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Fetch PDFium
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          url=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/bblanchon/pdfium-binaries/releases/latest \
            | grep -oE "https://[^\"]+pdfium-win-x64\.tgz")
          curl -fsSL "$url" -o pdfium.tgz
          mkdir -p pdfium
          tar -xzf pdfium.tgz -O bin/pdfium.dll > pdfium/pdfium.dll

      - name: Build
        run: cargo build --release --locked

      - name: Bundle
        shell: pwsh
        run: ./scripts/build-windows-app.ps1 -Root (Get-Location) -OutDir "$env:RUNNER_TEMP/ggPdf"

      - name: Build installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DBuildDir=$env:RUNNER_TEMP/ggPdf" `
            scripts/ggpdf.iss
        env:
          GGPDF_VERSION: ${{ inputs.version }}

      - uses: actions/upload-artifact@v4
        with:
          name: ggpdf-windows
          path: ggPdf-windows-${{ inputs.version }}-setup.exe
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/*.dmg dist/*.exe --clobber
          else
            gh release create "$tag" dist/*.dmg dist/*.exe \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes
          fi

          # Remove the ambiguous legacy DMG only after both replacements upload.
          assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
          legacy="ggPdf-macos-$VERSION.dmg"
          if printf '%s\n' "$assets" | grep -Fxq "$legacy"; then
            gh release delete-asset "$tag" "$legacy" --yes
          fi

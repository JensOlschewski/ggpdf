[package]
name = "ggpdf"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", features = ["persistence"] }
image = "0.25.10"
pdfium-render = "0.9.4"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
unicode-segmentation = "1.13.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", features = ["NSApplication"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSURL", "NSString"] }
winit = "0.30"
